[info]
name = "Mandarin Pinyin IM"
description = "Mandarin Chinese (pinyin) Config File"
version = "2026-11-22"
authors = []
website = ""

[core]
buffer_size = 64
auto_capitalize = false
# Pinyin keys are prefixes of each other (ma, man, mang),
# the candidate must be selected by the user.
auto_commit = false
page_size = 10
# Disable the auto-correction: pinyin keys of same length are too similar
# (zhongg ~ zhong1, nihao ~ nibao).
min_confidence = 1.0

